{# Cookie notice — same wording and choices the old site presented.
   The visitor's answer is pushed to the GTM dataLayer so tags can be gated there. #}
<div class="consent" id="consent" role="dialog" aria-live="polite"
     aria-labelledby="consent-text" hidden>
  <p class="consent__text" id="consent-text">
    אנו משתמשים בעוגיות (Cookies) ובטכנולוגיות דומות לשיפור חוויית הגלישה,
    ניתוח תנועה באתר והצגת תכנים מותאמים. לפרטים נוספים:
    <a href="/מדיניות-פרטיות/">מדיניות פרטיות</a>
  </p>
  <div class="consent__actions">
    <button class="btn btn-primary btn-sm" type="button" data-consent="accept">אישור</button>
    <button class="btn btn-outline btn-sm" type="button" data-consent="reject">דחייה</button>
  </div>
  <button class="consent__close" type="button" data-consent="close" aria-label="סגירת ההודעה">&times;</button>
</div>
